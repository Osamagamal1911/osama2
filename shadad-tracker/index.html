function topStats(){const volume=state.sessions.reduce((sum,s)=>sum+totalVolume(s),0);const done=state.sessions.reduce((sum,s)=>sum+totalDone(s),0);let thirty=state.sessions.filter(s=>new Date(s.completedAt||s.startedAt)>Date.now()-30*86400000).length;return `<div class="stats"><div class="stat"><b>${sessionCount()}</b><span>${t('sessions')}</span></div><div class="stat"><b>${done}</b><span>${t('setsLogged')}</span></div><div class="stat"><b>${displayNum(volume)}</b><span>${t('volume')}</span></div><div class="stat"><b>${thirty}</b><span>${t('thisMonth')}</span></div></div>`}
function homeView(){let next=SCHEDULE[state.nextSlot%7];let items=[...state.sessions].sort((a,b)=>(b.completedAt||'').localeCompare(a.completedAt||'')).slice(0,4);return `<section class="hero"><div class="eyebrow">${t('eyebrow')}</div><h1>${t('heroTitle')}</h1><p>${t('heroDescription')}</p><div class="row"><button class="btn primary" data-action="${state.draft?'resume':next===0?'rest':'start-next'}">${state.draft?t('resume'):next===0?t('completeRest'):t('startNext')} →</button><span class="pill">${t('next')}: ${next===0?t('restDay'):t('day')+' '+next}</span></div></section>${topStats()}<section class="section"><div class="sect-head"><h2>${t('plan')}</h2></div><p class="hint" style="margin:-4px 0 12px">${t('planHint')}</p><div class="days">${SCHEDULE.map((day,i)=>`<button class="day-card ${i===state.nextSlot?'active':''} ${!day?'rest':''}" data-action="${day?'select-day':'rest-slot'}" data-day="${day}" data-slot="${i}"><div class="day-num">${t('day')} ${i+1}</div><div class="day-main">${day||'☾'}</div><div class="day-label">${day?`${planned(day).length} ${t('exercise')}`:t('rest')}</div></button>`).join('')}</div></section><section class="section"><div class="sect-head"><h2>${t('last')}</h2><button class="btn small ghost" data-route="history">${t('goToHistory')}</button></div>${items.length?`<div class="card">${items.map(s=>`<div class="latest"><div><div class="latest-title">${t('day')} ${s.day} · ${dateFmt(s.completedAt)}</div><div class="subtle">${totalDone(s)} ${t('count')} · ${displayNum(totalVolume(s))} kg</div></div><span class="pill green">✓ ${t('completed')}</span></div>`).join('')}</div>`:`<div class="empty">${t('noSessions')}</div>`}</section><div class="section note">${t('offline')} · ${t('saved')} · ${t('editHint')}</div>`}
function newDraft(day){return {id:'s'+Date.now()+'-'+Math.random().toString(36).slice(2,7),day,startedAt:new Date().toISOString(),completedAt:null,exercises:Object.fromEntries(planned(day).map(e=>[e.id,{warm:Array.from({length:e.warmups},()=>({weight:'',reps:'',rir:'',done:false})),work:Array.from({length:e.sets},()=>({weight:'',reps:'',rir:'',done:false})),notes:''}])),notes:'',cardio:{done:false,duration:'20',speed:'4',incline:'10'},steps:''}}
function startDay(day){if(state.draft&&state.draft.day!==day&&!confirm(t('confirmNew')))return;if(!state.draft||state.draft.day!==day)state.draft=newDraft(day);save();routeTo('train')}
function restSlot(slot){if(state.draft&&!confirm(t('confirmNew')))return;if(state.draft)state.draft=null;state.restDays.push(new Date().toISOString());state.nextSlot=(slot+1)%7;save();toast(t('restComplete'));routeTo('home')}
function getLast(e,daySpecific=true){let arr=[...state.sessions].filter(s=>s.day===Number(e.id[1])&&s.exercises&&s.exercises[e.id]);if(!arr.length){arr=[...state.sessions].filter(s=>Object.keys(s.exercises||{}).some(eid=>lookup(s.day,eid)?.name===e.name))}arr.sort((a,b)=>(b.completedAt||'').localeCompare(a.completedAt||''));if(!arr.length)return null;let s=arr[0], matched=Object.keys(s.exercises).find(id=>lookup(s.day,id)?.name===e.name);return {session:s,work:s.exercises[matched].work||[]}}
function prevString(e){let prev=getLast(e);if(!prev)return t('noPrevious');const lines=prev.work.filter(s=>s.done).map(s=>`${s.weight===''?'BW':s.weight+' kg'} × ${s.reps}`).join(' · ');return `${dateFmt(prev.session.completedAt)} — ${lines||t('noPrevious')}`}
function setRows(e,kind,sets){return sets.map((s,i)=>`<tr class="${s.done?'is-done':''}"><td class="set-kind"><b>${kind==='warm'?t('warm'):t('set')} ${i+1}</b>${kind==='warm'?'<small>W/U</small>':''}</td>${['weight','reps','rir'].map(f=>`<td><input type="number" inputmode="decimal" min="0" ${f==='rir'?'max="10" step="1"':f==='reps'?'step="1"':'step="0.5"'} aria-label="${esc(e.name)} ${kind} ${i+1} ${f}" placeholder="${f==='rir'&&kind==='work'?e.rir:'—'}" data-field="set-field" data-eid="${e.id}" data-kind="${kind}" data-i="${i}" data-value="${f}" value="${esc(s[f])}"></td>`).join('')}<td><button class="markdone" aria-label="Mark set done" data-action="toggle-set" data-eid="${e.id}" data-kind="${kind}" data-i="${i}">${s.done?'✓':'○'}</button></td></tr>`).join('')}
function exerciseCard(e,index){const x=state.draft.exercises[e.id],pr=getLast(e);return `<article class="exercise"><div class="ex-top"><div><div class="ex-index">${t('exercise')} ${index+1} / ${planned(state.draft.day).length}</div><div class="ex-name">${esc(e.name)}</div><div class="targets"><span class="target">${e.sets} ${t('workSets')}</span><span class="target">${e.reps} ${t('reps')}</span><span class="target">RIR ${e.rir}</span><span class="target">${e.rest}</span></div></div><div class="ex-actions">${e.video?`<a class="ico-btn" href="${esc(e.video)}" target="_blank" rel="noopener noreferrer" title="${t('video')}" aria-label="${t('video')}">▶</a>`:''}<button class="ico-btn" data-action="ex-timer" data-seconds="${e.restSeconds}" title="${t('startTimer')}">◷</button></div></div><table class="set-table"><thead><tr><th style="width:53px"></th><th>${t('weight')}</th><th>${t('reps')}</th><th>RIR</th><th>✓</th></tr></thead><tbody>${setRows(e,'warm',x.warm)}${setRows(e,'work',x.work)}</tbody></table><div class="prev"><b>${t('previous')}:</b> ${esc(prevString(e))}</div><div class="ex-bottom"><div class="row">${pr?`<button class="btn ghost small" data-action="prefill" data-eid="${e.id}">↶ ${t('usePrevious')}</button>`:''}<button class="btn ghost small" data-action="add-set" data-eid="${e.id}">${t('addSet')}</button>${x.work.length>e.sets?`<button class="btn ghost small" data-action="remove-set" data-eid="${e.id}">−</button>`:''}</div><span class="smalltext muted">${t('restTime')}: ${esc(e.rest)}</span></div><details class="ex-notes" ${x.notes?'open':''}><summary>${t('notes')}${x.notes?' •':''}</summary><textarea data-field="exercise-notes" data-eid="${e.id}" placeholder="${t('notes')}">${esc(x.notes)}</textarea></details></article>`}
function trainView(){if(!state.draft){return `<div class="sect-head"><h2>${t('chooseDay')}</h2></div><div class="grid2">${[1,2,3,4,5].map(day=>`<div class="card"><div class="eyebrow">${t('goal')}</div><h2 style="margin:6px 0">${t('day')} ${day}</h2><p class="muted smalltext">${planned(day).length} ${t('exercise')} · ${sessionPlanTotal(day)} ${t('count')}</p><button class="btn primary block" data-action="start-day" data-day="${day}">${t('start')}</button></div>`).join('')}</div><p class="note section">${t('editHint')}</p>`}let s=state.draft;let total=sessionPlanTotal(s.day),done=totalDone(s);return `<div class="workout-head"><div><div class="eyebrow">${t('session')} · ${dateFmt(s.startedAt)}</div><h1 class="workout-title">${t('day')} ${s.day}</h1><div class="muted smalltext">${planned(s.day).length} ${t('exercise')} · ${total} ${t('workSets')}</div></div><button class="btn small ghost" data-route="home">${t('back')}</button></div><div class="progress-track"><div id="workoutBar" class="progress-fill" style="width:${Math.min(100,done/total*100)}%"></div></div><p id="session-progress" class="smalltext muted" style="margin:7px 0 17px">${done} / ${total} ${t('sessionProgress')}</p>${planned(s.day).map(exerciseCard).join('')}<div class="card section"><div class="sect-head"><h2>${t('cardio')}</h2></div><p class="hint">${t('cardioTarget')}</p><label class="row" style="margin:12px 0 15px"><input type="checkbox" data-field="cardio-done" ${s.cardio?.done?'checked':''} style="min-height:21px;width:21px;accent-color:var(--orange)"> <b>${t('cardioDone')}</b></label><div class="fields">${[['duration','duration'],['speed','speed'],['incline','incline']].map(([key,label])=>`<div class="field"><label>${t(label)}</label><input type="number" min="0" inputmode="decimal" data-field="cardio-field" data-key="${key}" value="${esc(s.cardio?.[key]??'')}"></div>`).join('')}</div><div class="field hspace"><label>${t('steps')}</label><input type="number" min="0" inputmode="numeric" data-field="steps" value="${esc(s.steps)}" placeholder="0"></div><div class="field hspace"><label>${t('sessionNotes')}</label><textarea data-field="session-notes" placeholder="${t('notes')}">${esc(s.notes)}</textarea></div></div><div class="session-footer"><div class="row spread"><div class="timer"><span id="clock" class="timer-clock">00:00</span><button class="btn small ghost" data-action="timer-toggle" id="timerToggle">${t('startTimer')}</button><button class="btn small ghost" data-action="timer-reset">↺</button></div><button class="btn primary" data-action="finish">✓ ${t('finish')}</button></div></div>`}
function sessionRows(s){return Object.entries(s.exercises||{}).flatMap(([eid,logs])=>[...(logs.warm||[]).map((x,i)=>({eid,index:i,type:'Warmup',...x})),...(logs.work||[]).map((x,i)=>({eid,index:i,type:'Working',...x}))]).filter(x=>x.done)}
function metricSeries(name,which=metric){return state.sessions.map(s=>{let sets=[];for(let [id,log] of Object.entries(s.exercises||{}))if(lookup(s.day,id)?.name===name)sets.push(...(log.work||[]).filter(x=>x.done&&n(x.reps)>0));if(!sets.length)return null;let val=which==='volume'?sets.reduce((sum,x)=>sum+n(x.weight)*n(x.reps),0):which==='reps'?Math.max(...sets.map(x=>n(x.reps))):Math.max(...sets.map(x=>n(x.weight)));return {date:s.completedAt||s.startedAt,val}}).filter(Boolean).sort((a,b)=>a.date.localeCompare(b.date))}
function chartSVG(series){if(!series.length)return `<div class="empty" style="padding:30px 10px">${t('emptyChart')}</div>`;let arr=series.slice(-10);const W=700,H=275,L=50,R=24,T=20,B=44;let min=Math.min(...arr.map(x=>x.val)),max=Math.max(...arr.map(x=>x.val));if(min===max){min=Math.max(0,min*0.75-1);max=max*1.15+1}let padded=(max-min)*.1;min=Math.max(0,min-padded);max+=padded;const x=i=>L+(W-L-R)*(arr.length===1?.5:i/(arr.length-1));const y=v=>T+(max-v)/(max-min)*(H-T-B);const points=arr.map((a,i)=>`${x(i)},${y(a.val)}`).join(' ');const ticks=[0,1,2,3].map(i=>{let v=min+(max-min)*i;let yy=y(v);return `<line x1="${L}" x2="${W-R}" y1="${yy}" y2="${yy}" stroke="#34363e" stroke-dasharray="4 5"/><text x="${L-6}" y="${yy+4}" text-anchor="end" class="chartlabel">${displayNum(v)}</text>`}).join('');return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Exercise progress chart">${ticks}<polyline class="chartline" points="${points}"/>${arr.map((a,i)=>`<circle class="chartpoint" cx="${x(i)}" cy="${y(a.val)}" r="5"/><text class="chartlabel" text-anchor="middle" x="${x(i)}" y="${H-12}">${dateFmt(a.date).split(' ').slice(0,2).join(' ')}</text>`).join('')}</svg>`}
function progressView(){const opts=uniqueExercises();if(!opts.includes(selectedExercise))selectedExercise=opts[0];let series=metricSeries(selectedExercise),best=series.length?Math.max(...series.map(x=>x.val)):null;let cardio=state.sessions.filter(s=>s.cardio?.done).length;return `<div class="sect-head"><h2>${t('progress')}</h2><span class="pill">${t('all')}</span></div>${topStats()}<section class="section chartbox"><div class="grid2"><div class="field"><label>${t('chooseExercise')}</label><select id="exSelect" class="ch-select">${opts.map(v=>`<option value="${esc(v)}" ${v===selectedExercise?'selected':''}>${esc(v)}</option>`).join('')}</select></div><div class="field"><label>${t('metric')}</label><select id="metricSelect"><option value="weight" ${metric==='weight'?'selected':''}>${t('bestWeight')}</option><option value="volume" ${metric==='volume'?'selected':''}>${t('bestVolume')}</option><option value="reps" ${metric==='reps'?'selected':''}>${t('bestReps')}</option></select></div></div><div class="row spread hspace"><div><div class="hint">${t('allTimeBest')}</div><div class="trend-value">${best===null?'—':displayNum(best)} <span style="font-size:13px;color:var(--muted)">${metric==='reps'?t('reps'):'kg'}</span></div></div><div class="hint">${series.length} ${t('sessions')}</div></div>${chartSVG(series)}</section><section class="section"><div class="sect-head"><h2>${t('summary')}</h2></div><div class="grid2"><div class="stat"><b>${cardio}</b><span>${t('cardioStats')}</span></div><div class="stat"><b>${displayNum(state.sessions.reduce((a,s)=>a+totalVolume(s),0))}</b><span>${t('volume')}</span></div></div><p class="hint hspace">${t('disclaimer')}</p></section>`}
function historyView(){let arr=[...state.sessions].sort((a,b)=>(b.completedAt||'').localeCompare(a.completedAt||''));return `<div class="sect-head"><h2>${t('history')}</h2><span class="pill">${arr.length} ${t('sessions')}</span></div>${!arr.length?`<div class="empty"><div class="symbol">▤</div>${t('noSessions')}</div>`:arr.map(s=>{let rows=sessionRows(s),vol=totalVolume(s);return `<article class="card"><div class="row spread"><div><div class="eyebrow">${dateFmt(s.completedAt||s.startedAt)} · ${timeFmt(s.startedAt)}</div><h2 style="margin:5px 0 3px">${t('day')} ${s.day}</h2><div class="muted smalltext">${rows.filter(x=>x.type==='Working').length} ${t('count')} · ${displayNum(vol)} kg · ${s.cardio?.done?'✓ '+t('cardio'):''}</div></div><div class="row"><button class="btn small ghost" data-action="reopen" data-id="${esc(s.id)}">${t('reopen')}</button><button class="btn small danger" data-action="delete-session" data-id="${esc(s.id)}">${t('delete')}</button></div></div><details class="history-details"><summary>${t('more')} · ${rows.length} ${t('count')}</summary><div style="overflow:auto"><table><thead><tr><th>${t('exercise')}</th><th>${t('type')}</th><th>${t('weight')}</th><th>${t('reps')}</th><th>RIR</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${esc(lookup(s.day,r.eid)?.name||r.eid)}</td><td>${r.type==='Working'?t('work'):t('warm')}</td><td>${esc(r.weight||'—')}</td><td>${esc(r.reps)}</td><td>${esc(r.rir||'—')}</td></tr>`).join('')}</tbody></table></div>${s.notes?`<p class="hint">${esc(s.notes)}</p>`:''}${s.steps?`<p class="hint">${t('steps')}: ${esc(s.steps)}</p>`:''}</details></article>`}).join('')}`}
function settingsView(){return `<div class="sect-head"><h2>${t('settings')}</h2></div><div class="card"><h3 style="margin:0 0 8px">${t('storageTitle')}</h3><p class="muted">${t('storageDesc')}</p><div class="pill green">✓ ${t('storageSaved')}</div><p class="hint hspace">${t('lastSaved')}: ${state.lastSavedAt?dateFmt(state.lastSavedAt)+' '+timeFmt(state.lastSavedAt):t('storageNever')}</p><button class="btn ghost small" data-action="protect-storage">${t('protectStorage')}</button></div><div class="card"><h3 style="margin:0 0 8px">${t('backup')}</h3><p class="muted">${t('backupDesc')}</p>${state.sessions.length-(state.lastBackupCount||0)>=5?`<p class="note">${t('backupReminder')}</p>`:''}<div class="row hspace"><button class="btn primary" data-action="export-json">↓ ${t('exportJSON')}</button><button class="btn ghost" data-action="export-csv">↓ ${t('exportCSV')}</button><button class="btn ghost" data-action="import-json">↑ ${t('importJSON')}</button></div></div><div class="card"><h3 style="margin:0 0 10px">${t('about')}</h3><p class="muted">${t('aboutText')}</p><div class="pill green">✓ ${t('offline')}</div></div><div class="card"><h3 style="margin:0 0 12px">${t('dataControl')}</h3><button class="btn danger" data-action="wipe">${t('wipe')}</button></div>`}
function refreshProgress(){if(!state.draft)return;const done=totalDone(state.draft),total=sessionPlanTotal(state.draft.day);let p=document.getElementById('session-progress'),bar=document.getElementById('workoutBar');if(p)p.textContent=`${done} / ${total} ${t('sessionProgress')}`;if(bar)bar.style.width=Math.min(100,done/total*100)+'%'}
function toggleSet(b){let x=state.draft?.exercises?.[b.dataset.eid]?.[b.dataset.kind]?.[Number(b.dataset.i)];if(!x)return;if(!x.done&&!n(x.reps)){toast(t('needsReps'));return}x.done=!x.done;save();let tr=b.closest('tr');tr?.classList.toggle('is-done',x.done);b.textContent=x.done?'✓':'○';refreshProgress()}
function copyPrevious(eid){let e=lookup(state.draft.day,eid),prev=getLast(e);if(!prev)return;const rows=state.draft.exercises[eid].work;prev.work.forEach((p,i)=>{if(!rows[i])return;for(let f of ['weight','reps','rir'])if(rows[i][f]==='')rows[i][f]=p[f]??''});save();render();toast(t('copy'))}
function finishWorkout(){let s=state.draft;if(!s)return;if(totalDone(s)===0&&!confirm(t('confirmFinish')))return;s.completedAt=new Date().toISOString();state.sessions.push(s);let i=SCHEDULE.indexOf(s.day);state.nextSlot=(i+1)%7;state.draft=null;save();stopTimer();toast(t('good'));routeTo('history')}
function startTimer(seconds){timerRemaining=Math.max(1,seconds);timerEnd=Date.now()+timerRemaining*1000;if(timerId)clearInterval(timerId);timerId=setInterval(tickTimer,300);updateTimerDisplay()}
function tickTimer(){timerRemaining=Math.max(0,Math.ceil((timerEnd-Date.now())/1000));if(timerRemaining<=0){clearInterval(timerId);timerId=null;try{navigator.vibrate?.([300,180,300])}catch{}toast(t('timerComplete'))}updateTimerDisplay()}
function stopTimer(){if(timerId){timerRemaining=Math.max(0,Math.ceil((timerEnd-Date.now())/1000));clearInterval(timerId);timerId=null}updateTimerDisplay()}
function updateTimerDisplay(){let c=document.getElementById('clock'),b=document.getElementById('timerToggle');if(c){c.textContent=String(Math.floor(timerRemaining/60)).padStart(2,'0')+':'+String(timerRemaining%60).padStart(2,'0');c.classList.toggle('ready',timerRemaining===0)}if(b)b.textContent=timerId?t('stopTimer'):t('startTimer')}
function csvQuote(a){let s=String(a??'');return '"'+s.replace(/"/g,'""')+'"'}function download(name,data,mime){let blob=new Blob([data],{type:mime}),url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500)}
function exportBackup(){state.lastBackupAt=new Date().toISOString();state.lastBackupCount=state.sessions.length;save();download('shadad-backup-'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify({format:'shadad-split-tracker',exportedAt:new Date().toISOString(),data:state},null,2),'application/json');toast(t('exported'));render()}
function exportCsv(){const head=['Session ID','Date','Day','Exercise','Type','Set','Weight kg','Reps','RIR','Done','Session Notes','Exercise Notes'];let data=[head];for(let s of state.sessions.concat(state.draft?[state.draft]:[])){for(let [eid,x] of Object.entries(s.exercises||{})){for(let kind of ['warm','work'])for(let [idx,log] of (x[kind]||[]).entries())if(log.done||log.weight!==''||log.reps!=='')data.push([s.id,s.completedAt||s.startedAt,s.day,lookup(s.day,eid)?.name||eid,kind,idx+1,log.weight,log.reps,log.rir,log.done,s.notes,x.notes])}}download('shadad-sets-'+new Date().toISOString().slice(0,10)+'.csv','\ufeff'+data.map(row=>row.map(csvQuote).join(',')).join('\r\n'),'text/csv;charset=utf-8');toast(t('exported'))}
function validateImport(data){let s=data?.format==='shadad-split-tracker'?data.data:data;return s&&s.version===1&&Array.isArray(s.sessions)&&Number.isInteger(s.nextSlot)&&s.nextSlot>=0&&s.nextSlot<=6&&s.sessions.every(x=>Number.isInteger(x.day)&&x.day>=1&&x.day<=5&&x.exercises&&typeof x.exercises==='object'&&typeof x.id==='string')&&(!s.draft||(s.draft.day>=1&&s.draft.day<=5&&s.draft.exercises))?s:null}
async function importBackup(file){try{let parsed=JSON.parse(await file.text()),incoming=validateImport(parsed);if(!incoming){toast(t('invalidFile'));return}if(!confirm(t('confirmImport')))return;state={...blankState(),...incoming,lang:state.lang};save();stopTimer();routeTo('home');toast(t('imported'))}catch{toast(t('invalidFile'))}}
async function protectStorage(){try{if(!navigator.storage?.persist){toast(t('persistUnsupported'));return;}const ok=await navigator.storage.persist();toast(t(ok?'persistGranted':'persistDenied'))}catch{toast(t('persistDenied')}}function clickAction(e){let btn=e.target.closest('[data-action]');if(!btn)return;let a=btn.dataset.action;switch(a){case 'start-next':startDay(SCHEDULE[state.nextSlot]||1);break;case 'resume':routeTo('train');break;case 'start-day':case 'select-day':startDay(Number(btn.dataset.day));break;case 'rest':case 'rest-slot':restSlot(Number(btn.dataset.slot??state.nextSlot));break;case 'prefill':copyPrevious(btn.dataset.eid);break;case 'toggle-set':toggleSet(btn);break;case 'add-set':state.draft.exercises[btn.dataset.eid].work.push({weight:'',reps:'',rir:'',done:false});save();render();break;case 'remove-set':{let e1=lookup(state.draft.day,btn.dataset.eid),arr=state.draft.exercises[btn.dataset.eid].work;if(arr.length>e1.sets)arr.pop();save();render();break}case 'finish':finishWorkout();break;case 'ex-timer':startTimer(Number(btn.dataset.seconds));break;case 'timer-toggle':if(timerId)stopTimer();else startTimer(timerRemaining||150);break;case 'timer-reset':stopTimer();timerRemaining=0;updateTimerDisplay();break;case 'delete-session':if(confirm(t('confirmDelete'))){state.sessions=state.sessions.filter(x=>x.id!==btn.dataset.id);save();render()}break;case 'reopen':{let s=state.sessions.find(x=>x.id===btn.dataset.id);if(!s)return;if(state.draft&&!confirm(t('confirmEdit')))return;state.sessions=state.sessions.filter(x=>x.id!==s.id);state.draft=structuredClone(s);state.draft.completedAt=null;save();routeTo('train');break}case 'protect-storage':protectStorage();break;case 'export-json':exportBackup();break;case 'export-csv':exportCsv();break;case 'import-json':document.getElementById('importFile').click();break;case 'wipe':if(confirm(t('confirmWipe'))){state=blankState();save();stopTimer();routeTo('home')}break;}}
document.addEventListener('click',e=>{let nav=e.target.closest('[data-route]');if(nav){routeTo(nav.dataset.route);return}clickAction(e)});
document.addEventListener('input',e=>{let target=e.target;let f=target.dataset.field;if(!state.draft||!f)return;switch(f){case 'set-field':{let set=state.draft.exercises[target.dataset.eid][target.dataset.kind][Number(target.dataset.i)];let val=target.value;set[target.dataset.value]=val;break}case 'exercise-notes':state.draft.exercises[target.dataset.eid].notes=target.value;break;case 'session-notes':state.draft.notes=target.value;break;case 'steps':state.draft.steps=target.value;break;case 'cardio-field':state.draft.cardio[target.dataset.key]=target.value;break;}save()});
document.addEventListener('change',e=>{if(e.target.id==='exSelect'){selectedExercise=e.target.value;render()}else if(e.target.id==='metricSelect'){metric=e.target.value;render()}else if(e.target.dataset.field==='cardio-done'){state.draft.cardio.done=e.target.checked;save()}});
document.getElementById('importFile').addEventListener('change',async e=>{if(e.target.files[0])await importBackup(e.target.files[0]);e.target.value=''});
document.getElementById('langBtn').addEventListener('click',()=>{state.lang=state.lang==='en'?'ar':'en';save();render()});document.getElementById('brandHome').addEventListener('click',()=>routeTo('home'));render();
</script>
<script>if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(()=>{}));}</script>
</body></html>
